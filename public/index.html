<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f4">
  <title>XYZNOT — read papers like you wrote them</title>
  <meta name="description" content="Paste an arXiv link. Citations open in place, figures explain themselves, and an assistant that has read every page answers your questions.">
  <link rel="canonical" href="https://xyznot.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="XYZNOT — read papers like you wrote them">
  <meta property="og:description" content="An arXiv reader with in-place citations, figure explanations and an assistant that has read the whole paper.">
  <meta property="og:url" content="https://xyznot.com/">
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/font-2.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/home.css">
</head>
<body class="home">

  <header class="top">
    <a class="wordmark" href="/">XYZNOT</a>
    <div class="auth">
      <a class="pill" id="signin" href="/library">Sign in</a>
      <a class="pill solid" id="open" href="/library" hidden>Library <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      <div id="user"></div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1><span>read papers like</span> <span class="last-word">you wrote them<span class="period">.</span></span></h1>
      <div class="search">
        <form class="ask" id="ask" role="search">
          <input id="q" placeholder="Search a paper, or paste an arXiv link" autocomplete="off" spellcheck="false"
            aria-label="Search papers" role="combobox" aria-controls="results" aria-expanded="false" aria-autocomplete="list">
          <button type="submit">Read <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </form>
        <ul class="results" id="results" role="listbox" hidden></ul>
      </div>
      <p class="tip" id="tip"></p>
    </section>

  </main>

  <footer>
    <a href="/privacy.html">Privacy</a>
    <a href="/terms.html">Terms</a>
  </footer>


  <script type="module">
    import { initAuth, signedIn, openSignIn, mountUserButton } from "/js/auth.js";
    import { attachSearch, importPaper } from "/js/search.js";
    const $ = (s) => document.querySelector(s);
    const params = new URLSearchParams(location.search);
    const ready = initAuth().catch(() => null);

    // Signed in: go to `path`. Signed out: sign in first, then Clerk continues to `path`.
    async function go(path) {
      await ready;
      if (signedIn()) location.href = path; else openSignIn(path);
    }

    const tip = $("#tip");
    const { open } = attachSearch({
      form: $("#ask"), input: $("#q"), list: $("#results"), tip, go,
      // Venue PDFs are imported into the library, so signed-out visitors sign in first.
      async importPdf(r) {
        await ready;
        if (signedIn()) return importPaper(r, tip);
        openSignIn("/?import=" + encodeURIComponent(r.url) + "&title=" + encodeURIComponent(r.title));
      },
      onToggle: (shown) => document.body.classList.toggle("searching", shown),
    });
    $("#signin").onclick = (e) => { e.preventDefault(); go("/library"); };

    await ready;
    if (signedIn()) {
      $("#signin").hidden = true;
      $("#open").hidden = false;
      mountUserButton($("#user"));
      if (params.has("import")) open({ kind: "pdf", url: params.get("import"), title: params.get("title") || "Paper" });
    } else if (params.has("signin")) {
      openSignIn(params.get("redirect") || "/library");
    }
    if (params.has("signin") || params.has("import")) history.replaceState(null, "", "/");
  </script>
</body>
</html>
